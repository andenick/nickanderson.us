<!-- nickanderson.us — in_header include (referenced from _site.yml).
     Underscore-prefixed so rmarkdown::render_site() does NOT copy it into docs/
     (it is read by pandoc at render time only).

     Per-page <meta name="description">, canonical, Open Graph and Twitter tags
     live in the per-page _meta_<page>.html includes, which are listed AFTER
     this file in each page's YAML. -->

<!-- Favicon (D4 identity): self-contained inline SVG monogram, no external asset. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23640000'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='17' fill='white' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">

<!-- Stylesheets, in cascade order:
       1. shared/arcanum.css  — the Arcanum Site Kit design system (vendored)
       2. styles.css          — this site's accent identity + layout + typography
       3. assets/gantt.css    — the landing-page Coverage Gantt component
     All served from this repo. No CDN, no webfont, no external request. -->
<link rel="stylesheet" href="shared/arcanum.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="assets/gantt.css">

<script>
  // No-FOUC: apply the saved theme before first paint.
  (function () {
    try {
      var t = localStorage.getItem("ark-theme");
      if (t === "dark" || t === "light") {
        document.documentElement.setAttribute("data-theme", t);
      }
    } catch (e) { /* ignore; system preference applies via CSS @media */ }
  })();
</script>
