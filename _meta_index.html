<!-- SCHOLARLY IDENTIFIERS — the `sameAs` array below is where the ORCID,
     Google Scholar, RePEc and SSRN profile URLs belong once they exist. JSON
     permits no comments, so the instructions live out here:

       1. Put the bare identifiers in R/identifiers.json (that file drives the
          visible "Profiles" row on the page, via R/identifiers.R).
       2. Then add the matching profile URLs to "sameAs" below, e.g.
            "sameAs": [
              "https://github.com/andenick",
              "https://orcid.org/0000-0000-0000-0000",
              "https://scholar.google.com/citations?user=XXXXXXXXXXXX",
              "https://ideas.repec.org/e/pXXX.html",
              "https://ssrn.com/author=XXXXXXX"
            ]
       3. Re-render index.Rmd.

     Nothing is pre-filled: an unowned identifier in structured data is a false
     claim to a search engine, not a placeholder. Leave `sameAs` as it stands
     until the real values are in hand. -->
<script type="application/ld+json">
{
 "@context": "https://schema.org",
 "@graph": [
  {
   "@type": "Person",
   "@id": "https://www.nickanderson.us/#nick",
   "name": "Nick Anderson",
   "url": "https://www.nickanderson.us/",
   "jobTitle": "PhD Candidate in Economics",
   "affiliation": {
    "@type": "CollegeOrUniversity",
    "name": "The New School for Social Research"
   },
   "knowsAbout": [
    "Public finance",
    "Banking and financial history",
    "Economic data construction",
    "Heterodox economics"
   ],
   "sameAs": ["https://github.com/andenick"]
  },
  {
   "@type": "WebSite",
   "@id": "https://www.nickanderson.us/#site",
   "url": "https://www.nickanderson.us/",
   "name": "Nick Anderson",
   "inLanguage": "en",
   "author": { "@id": "https://www.nickanderson.us/#nick" }
  }
 ]
}
</script>
